<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stereo AI</title>
<style>
:root{
  --bg:#f8f8f8;--bg2:#f0f0f2;--card:#ffffff;--ink:#1d1d20;--ink2:#6e6e73;--ink3:#a5a5ab;
  --line:#ececee;--acc:#8838e8;--accInk:#ffffff;--userBg:#c8e4fc;--userInk:#1c2a38;
  --aiBg:#ececef;--ok:#1a9e55;--warn:#c46a1b;--err:#d64545;--r:22px;--safeB:env(safe-area-inset-bottom,0px);
  --thinkBg:#efeff2;--toolBg:#ffffff;
  --accGrad:linear-gradient(135deg,#8f6cf3 0%,#8838e8 55%,#a62bdd 100%);
  --softSh:0 2px 12px rgba(110,80,180,0.10);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#17171a;--bg2:#222226;--card:#212125;--ink:#ececf0;--ink2:#9d9da4;--ink3:#6b6b72;
    --line:#2c2c31;--acc:#a06bef;--accInk:#fff;--userBg:#1e3a5c;--userInk:#d8e8fa;
    --aiBg:#232328;--thinkBg:#26262b;--toolBg:#222226;
    --accGrad:linear-gradient(135deg,#9a7bf0 0%,#9450ec 55%,#b13fe0 100%);
    --softSh:0 2px 12px rgba(0,0,0,0.35);}
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"SF Pro Text","HarmonyOS Sans SC","MiSans",sans-serif;
  background:linear-gradient(180deg,#fafafb 0%,#f7f8fb 52%,#eff3fa 100%) fixed;
  background-color:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;overflow:hidden;
  display:flex;flex-direction:column}
@media (prefers-color-scheme: dark){
  body{background:linear-gradient(180deg,#1a1a1e 0%,#17171a 55%,#141419 100%) fixed}
}
#hdr{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px;
  z-index:5}
#menuBtn,#histBtn{width:40px;height:40px;border-radius:50%;border:none;
  background:var(--card);box-shadow:var(--softSh);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
#menuBtn svg,#histBtn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#np{flex:1;display:flex;justify-content:center;min-width:0}
#npin{display:flex;align-items:center;gap:7px;min-width:0;max-width:100%;
  background:var(--card);border-radius:99px;padding:5px 15px 5px 6px;box-shadow:var(--softSh)}
#brand{width:30px;height:30px;border-radius:50%;background:var(--accGrad);display:flex;align-items:center;
  justify-content:center;flex:none;box-shadow:0 1px 4px rgba(136,56,232,0.35)}
#brand svg{width:16px;height:16px;fill:#fff;stroke:none}
#title{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#modelPill{flex:none;display:flex;align-items:center;gap:5px;padding:9px 13px;border-radius:99px;
  border:none;background:var(--card);box-shadow:var(--softSh);font-size:12.5px;color:var(--ink);cursor:pointer;max-width:150px}
#modelPill b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modelPill .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
#chat{flex:1;overflow-y:auto;padding:18px 16px 10px;-webkit-overflow-scrolling:touch}
.trow{margin-bottom:18px;max-width:100%}
.wrow{display:flex;justify-content:flex-end}
.bub{max-width:86%;padding:11px 15px;border-radius:var(--r);white-space:pre-wrap;word-break:break-word}
.bub.user{background:var(--userBg);color:var(--userInk);border-bottom-right-radius:8px;
  box-shadow:0 1px 6px rgba(120,160,210,0.18)}
.bub.ai{padding:2px 2px;white-space:pre-wrap}
.bub.ai.error{color:var(--err);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 15px}
.ai.error{color:var(--err);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:11px 15px;margin:2px 0}
.think{background:var(--thinkBg);border-radius:16px;padding:10px 13px;margin:0 0 8px;font-size:13px;color:var(--ink2);
  white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:hidden;position:relative}
.think::after{content:"";position:absolute;bottom:0;left:0;right:0;height:28px;background:linear-gradient(transparent,var(--thinkBg))}
.tstage{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);margin:4px 0}
.tstage .spin{width:11px;height:11px;border:1.6px solid var(--ink3);border-top-color:transparent;border-radius:50%;
  animation:sp 0.8s linear infinite;flex:none}
.spin{display:inline-block;width:11px;height:11px;border:1.6px solid var(--ink3);border-top-color:transparent;border-radius:50%;
  animation:sp 0.8s linear infinite;flex:none;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.toolrow{display:flex;align-items:center;gap:7px;background:var(--toolBg);border:1px solid var(--line);border-radius:14px;
  padding:8px 12px;margin:6px 0;font-size:12.5px;color:var(--ink2);max-width:86%;box-shadow:0 1px 5px rgba(110,80,180,0.06)}
.toolrow svg{width:13px;height:13px;stroke:var(--acc);fill:none;stroke-width:1.8;flex:none}
.toolrow code{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbub{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:10px 14px;margin:4px 0;max-width:260px;cursor:pointer;box-shadow:var(--softSh)}
.vbub .picon{width:30px;height:30px;border-radius:50%;background:var(--accGrad);display:flex;align-items:center;
  justify-content:center;flex:none}
.vbub .picon svg{width:13px;height:13px;fill:var(--accInk);stroke:none}
.vbub .vbar{flex:1;height:16px;display:flex;align-items:center;gap:2.5px}
.vbub .vbar i{width:2.5px;border-radius:2px;background:var(--ink3);display:block}
.vdur{font-size:11.5px;color:var(--ink3);flex:none}
.meta{font-size:11px;color:var(--ink3);margin-top:5px}
#composer{padding:8px 12px calc(var(--safeB) + 10px)}
#cwrap{display:flex;align-items:flex-end;gap:6px;background:var(--card);border:none;
  border-radius:26px;padding:7px 7px 7px 12px;align-items:flex-end;box-shadow:0 3px 16px rgba(110,80,180,0.13)}
#attachRow{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}
#attachRow:empty{display:none}
.achip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;font-size:12px;color:var(--ink2);flex:none;max-width:200px}
.achip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.achip b{cursor:pointer;color:var(--ink3);font-weight:400;flex:none}
#tin{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;font-family:inherit;
  resize:none;max-height:110px;line-height:1.45;padding:6px 0}
#tin::placeholder{color:var(--ink3)}
.cbtn{width:38px;height:38px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;
  justify-content:center;flex:none;cursor:pointer}
.cbtn svg{width:20px;height:20px;stroke:var(--ink2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stopBtn{display:none;background:#f03e3e;color:#fff}
#stopBtn svg{stroke:none}
#sendBtn{background:var(--accGrad);box-shadow:0 2px 8px rgba(136,56,232,0.35)}
#sendBtn svg{stroke:var(--accInk)}
#sendBtn:disabled{opacity:0.3}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 0 calc(var(--safeB) + 10px)}
.sheet.on{display:flex}
.shead{display:flex;align-items:center;padding:6px 16px 14px}
.shead .st{flex:1;font-size:19px;font-weight:700;letter-spacing:0.2px}
.sclose{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg2);
  display:flex;align-items:center;justify-content:center;cursor:pointer}
.sclose svg{width:15px;height:15px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.sbody{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.citem{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;
  margin-bottom:10px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 1px 6px rgba(110,80,180,0.05)}
.citem .ci{flex:1;min-width:0}
.citem .cn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.citem .cm{font-size:11.5px;color:var(--ink3);margin-top:2px}
.badge{font-size:10.5px;padding:2.5px 8px;border-radius:99px;flex:none}
.badge.live{background:rgba(26,158,85,0.13);color:var(--ok)}
.badge.perm{background:rgba(196,106,27,0.13);color:var(--warn)}
.badge.legacy{background:var(--bg2);color:var(--ink2)}
.cdel{width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.cdel svg{width:14px;height:14px;stroke:var(--ink3);stroke-width:1.8;fill:none;stroke-linecap:round}
.sect{font-size:12px;color:var(--ink3);font-weight:600;margin:16px 2px 8px;letter-spacing:0.4px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;
  box-shadow:0 1px 6px rgba(110,80,180,0.05)}
.phead{display:flex;align-items:center;padding:14px 16px;cursor:pointer;gap:8px}
.phead .pn{flex:1;font-weight:600;font-size:14px}
.phead .ks{font-size:11px;color:var(--ok)}
.phead .ks.no{color:var(--ink3)}
.phead .arr{width:16px;height:16px;stroke:var(--ink3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.pcard.open .arr{transform:rotate(90deg)}
.pmodels{display:none;padding:2px 10px 12px}
.pcard.open .pmodels{display:block}
.mrow{padding:10px 11px;border-radius:12px;font-size:13.5px;cursor:pointer;display:flex;align-items:center;gap:8px}
.mrow:active{background:var(--bg2)}
.mrow.cur{background:rgba(136,56,232,0.08);font-weight:600}
.mrow .ck{width:14px;height:14px;stroke:var(--acc);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.mdel{margin-left:auto;color:var(--ink3);font-size:16px;padding:0 6px;line-height:1}
.mrow.cur .ck{visibility:visible}
.keyrow{display:flex;gap:8px;padding:4px 10px 8px}
.keyin{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px;
  background:var(--bg);color:var(--ink);outline:0;font-family:ui-monospace,Menlo,monospace}
.keyin:focus{border-color:var(--acc)}
.kbtn{border:0;border-radius:12px;background:var(--accGrad);color:var(--accInk);font-size:13px;
  padding:0 16px;cursor:pointer;font-weight:600}
.effrow{display:flex;gap:8px;padding:2px 0 6px}
.eff{flex:1;text-align:center;padding:9px 0;border-radius:13px;border:1px solid var(--line);
  font-size:13px;color:var(--ink2);cursor:pointer;background:var(--card)}
.eff.cur{background:var(--accGrad);color:var(--accInk);border-color:transparent;font-weight:600}
.hint{font-size:12px;color:var(--ink3);padding:4px 2px;line-height:1.5}
#permDlg{position:fixed;inset:0;background:rgba(40,30,70,0.45);z-index:300;display:none;align-items:center;justify-content:center;padding:18px}
#permDlg.on{display:flex}
#permStack{position:relative;width:100%;max-width:420px;height:min(460px,72vh)}
#permCount{position:absolute;top:-34px;left:50%;transform:translateX(-50%);z-index:40;
  background:var(--warn);color:#fff;font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 16px;white-space:nowrap}
.permcard{position:absolute;inset:0;background:var(--card);border-radius:24px;padding:20px 18px 16px;
  box-shadow:0 16px 48px rgba(40,30,70,0.35);display:flex;flex-direction:column;
  transition:transform .22s ease,opacity .22s ease;will-change:transform}
.permcard .pt{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15.5px;margin-bottom:6px}
.permcard .pt svg{width:19px;height:19px;stroke:var(--warn);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.permcard .pdesc{font-size:13px;color:var(--ink2);margin-bottom:10px}
.permcard .pargs{background:var(--bg2);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--ink);
  font-family:ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;overflow-y:auto;
  flex:1;min-height:0;margin-bottom:14px}
.permcard .pbtns{display:flex;gap:10px}
.pbtn{flex:1;padding:13px 0;border-radius:15px;border:0;font-size:15px;font-weight:600;cursor:pointer}
.pbtn.no{background:var(--bg2);color:var(--ink)}
.pbtn.yes{background:var(--accGrad);color:var(--accInk)}
.plater{text-align:center;font-size:12.5px;color:var(--ink3);padding:10px 0 0;cursor:pointer}
#permFab{position:fixed;right:14px;bottom:100px;z-index:150;width:48px;height:48px;border-radius:50%;
  border:0;background:var(--warn);color:#fff;font-size:17px;font-weight:800;cursor:pointer;display:none;
  align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(196,106,27,0.45)}
#permFab.on{display:flex}
.fcard{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:11px 13px;margin:8px 0;max-width:340px;box-shadow:0 1px 6px rgba(110,80,180,0.06)}
.fcard .fico{width:38px;height:38px;border-radius:12px;background:var(--accGrad);color:var(--accInk);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.fcard .fmeta{flex:1;min-width:0}
.fcard .fname{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard .fsize{font-size:11px;color:var(--ink3);margin-top:2px}
.fcard .fbtns{display:flex;gap:6px;flex:none}
.fcard .fopen,.fcard .fshare{border:1px solid var(--line);background:var(--bg);color:var(--ink);
  border-radius:10px;padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer}
.histfbtn{border:1px dashed var(--line);background:var(--card);color:var(--ink2);
  border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.histfbox{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.mnote{background:rgba(136,56,232,0.07);border:1px solid rgba(136,56,232,0.25);border-radius:16px;padding:13px 15px;
  font-size:13.5px;line-height:1.6;color:var(--ink)}
.mnote b{color:var(--acc)}
.mnotebtn{margin-top:10px;display:block;width:100%;border:none;background:var(--accGrad);color:#fff;
  border-radius:12px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer}
#recOv{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;align-items:center;
  justify-content:flex-end;background:rgba(40,30,70,0.5);pointer-events:none}
#recOv.on{display:flex}
#recCard{background:var(--card);border-radius:26px;width:82%;max-width:340px;margin-bottom:calc(var(--safeB) + 40px);
  padding:22px 20px;display:flex;flex-direction:column;align-items:center;pointer-events:auto;position:relative;
  box-shadow:0 14px 44px rgba(40,30,70,0.30)}
#recX{position:absolute;top:-13px;right:-13px;width:34px;height:34px;border-radius:50%;background:var(--ink2);
  color:#fff;display:none;align-items:center;justify-content:center;font-size:15px;border:3px solid var(--card);cursor:pointer;pointer-events:auto}
#recX.on{display:flex}
#wave{display:flex;align-items:center;gap:3.5px;height:34px}
#wave i{width:3px;border-radius:2px;background:var(--acc);display:block}
#recT{font-size:12px;color:var(--ink3);margin-top:8px;font-variant-numeric:tabular-nums}
#recT.cancel{color:var(--err);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(var(--safeB) + 90px);transform:translateX(-50%);
  background:#2a2a2e;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:90;
  display:none;max-width:82%;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,0.22)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ink3);gap:8px;padding-bottom:18%}
.empty .lg{width:68px;height:68px;border-radius:22px;background:var(--accGrad);display:flex;align-items:center;justify-content:center;margin-bottom:8px;
  box-shadow:0 8px 26px rgba(136,56,232,0.35)}
.empty .lg svg{width:34px;height:34px;fill:#fff;stroke:none}
.empty .e1{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:0.2px}
.empty .e2{font-size:13.5px}

/* ---------- 语音通话页 ---------- */
.callpg{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;
  --fg:#fff;--csub:rgba(255,255,255,.56);--soft:rgba(255,255,255,.09);--line:rgba(255,255,255,.10);--cacc:#5b8cff;
  background:#0f1115;color:var(--fg);box-sizing:border-box;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(18px + env(safe-area-inset-bottom))}
.callpg.open{display:flex;animation:cin .18s ease}
@keyframes cin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.callpg[data-spk="user"]{--cacc:#12b886}
.callpg[data-spk="ai"]{--cacc:#5b8cff}
.chead{display:flex;align-items:center;gap:10px;flex:none}
.chead .cst{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--csub);letter-spacing:.2px}
.cico{width:36px;height:36px;border-radius:50%;border:none;background:var(--soft);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none}
.cico.on{background:var(--cacc);color:#fff}
.cico:active{opacity:.6}
.cwave{flex:1;position:relative;min-height:0}
.cbars{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;gap:4px;height:110px}
.cbars i{display:block;width:3px;height:30px;border-radius:2px;background:var(--cacc);opacity:.55;transform:scaleY(.14);transition:transform .08s linear}
.cring{position:absolute;left:50%;top:50%;width:216px;height:216px;margin:-108px 0 0 -108px;border-radius:50%;border:1.5px solid var(--cacc);opacity:.3;transform:scale(1);transition:transform .09s linear,opacity .09s linear}
.cav{position:absolute;left:50%;top:50%;width:173px;height:173px;margin:-86.5px 0 0 -86.5px;border-radius:50%;background:linear-gradient(160deg,#2a2f3a,#171b23);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:43px;font-weight:700;color:var(--cacc);box-shadow:0 10px 34px rgba(0,0,0,.55),0 0 0 2.5px rgba(255,255,255,.07)}
.callpg::before{content:'';position:absolute;inset:0;background:#1c2230;filter:blur(52px);opacity:.4}
.callpg::after{content:'';position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(11,13,17,.62),rgba(11,13,17,.30) 42%,rgba(11,13,17,.88));pointer-events:none}
.callpg>*{position:relative;z-index:1}
.ctap{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);border:none;border-radius:28px;padding:15px 34px;font-size:15px;font-weight:600;background:var(--cacc);color:#fff;display:none;align-items:center;justify-content:center}
.ctap:active{opacity:.7}
.csub{flex:none;max-height:26vh;overflow-y:auto;margin:10px 2px 0;font-size:14px;line-height:1.55;-webkit-overflow-scrolling:touch}
.csub.off{display:none}
.csub .l{margin:0 0 7px;display:flex;gap:8px}
.csub .l b{flex:none;font-size:12px;font-weight:700;color:var(--csub);padding-top:2px}
.csub .l.u b{color:#12b886}
.csub .l.a b{color:#5b8cff}
.csub .l span{flex:1;min-width:0;word-break:break-word}
.csub .l.u span{color:rgba(255,255,255,.72)}
.cbar{flex:none;display:flex;align-items:center;justify-content:center;gap:28px;margin-top:14px}
.cbtn2{width:62px;height:62px;border-radius:50%;border:none;background:var(--soft);color:var(--fg);display:flex;align-items:center;justify-content:center}
.cbtn2:active{opacity:.6}
.cbtn2.on{background:#fff;color:#0f1115}
.cbtn2.hang{background:#f03e3e;color:#fff}
.cbtn2.hang:active{opacity:.7}
.cspin{display:none;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--cacc);margin-right:5px}

<script>
var AI_TOKEN=(function(){try{return (window.Android&&Android.aiToken)?Android.aiToken():''}catch(e){return ''}})();
function withTk(u){if(!AI_TOKEN||!u||u.indexOf('tk=')>=0)return u;return u+(u.indexOf('?')>=0?'&':'?')+'tk='+encodeURIComponent(AI_TOKEN)}
(function(){
  var _f=window.fetch;
  if(typeof _f!=='function')return;
  window.fetch=function(u,o){
    try{
      if(!AI_TOKEN)return _f.apply(this,arguments);
      o=o||{};
      var h=o.headers;
      if(typeof Headers!=='undefined'&&h instanceof Headers){
        h=new Headers(h);
        if(!h.has('X-AI-Token'))h.set('X-AI-Token',AI_TOKEN);
      }else if(Object.prototype.toString.call(h)==='[object Array]'){
        var has=false,i;
        for(i=0;i<h.length;i++){if(String(h[i][0]).toLowerCase()==='x-ai-token')has=true}
        h=has?h:h.concat([['X-AI-Token',AI_TOKEN]]);
      }else{
        h=h||{};
        var has2=false,k;
        for(k in h){if(String(k).toLowerCase()==='x-ai-token')has2=true}
        if(!has2)h['X-AI-Token']=AI_TOKEN;
      }
      o.headers=h;
      return _f.call(this,u,o);
    }catch(e){return _f.apply(this,arguments)}
  };
})();
var $=function(id){return document.getElementById(id)};
var chatEl=$('chat'),tin=$('tin'),sendBtn=$('sendBtn'),esEl=$('emptyState');
function showEmpty(){chatEl.appendChild(esEl);esEl.style.display='flex'}
function hideEmpty(){esEl.style.display='none'}
var curConv='',busyMap={},attachList=[],meta={model:'',provider:'',effort:'medium'};
var recOn=false,recPend=false,recAbort=false,recStartT=0,recTimer=null,recXTouch=false;
var permBusy=false,es=null;

function toast(t){var el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(function(){el.style.display='none'},2200)}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;')}
function jsArg(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(s){
  s=esc(s);
  var blocks=[];
  s=s.replace(/```([\s\S]*?)```/g,function(m,c){blocks.push('<pre style="background:var(--bg2);border-radius:11px;padding:11px 13px;overflow-x:auto;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;margin:8px 0;white-space:pre">'+c.replace(/^\n/,'')+'</pre>');return '\u0001B'+(blocks.length-1)+'\u0001'});
  var inls=[];
  s=s.replace(/`([^`\n]+)`/g,function(m,c){inls.push('<code style="background:var(--bg2);border-radius:5px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;font-size:13px">'+c+'</code>');return '\u0001I'+(inls.length-1)+'\u0001'});
  var lines=s.split('\n'),out=[],i;
  for(i=0;i<lines.length;i++){
    var ln=lines[i];
    if(/^\s*\|.+\|\s*$/.test(ln)){
      var tbl=[ln];
      while(i+1<lines.length&&/^\s*\|.+\|\s*$/.test(lines[i+1])){tbl.push(lines[++i])}
      out.push(renderTable(tbl));continue;
    }
    if(/^\s*[-*] /.test(ln)){
      var ul=[];
      while(i<lines.length&&/^\s*[-*] /.test(lines[i])){ul.push(lines[i].replace(/^\s*[-*] /,''));i++}
      i--;
      out.push('<ul style="margin:6px 0 6px 20px;padding:0">'+ul.map(function(x){return '<li style="margin:3px 0">'+x+'</li>'}).join('')+'</ul>');continue;
    }
    if(/^\s*\d+\. /.test(ln)){
      var ol=[];
      while(i<lines.length&&/^\s*\d+\. /.test(lines[i])){ol.push(lines[i].replace(/^\s*\d+\. /,''));i++}
      i--;
      out.push('<ol style="margin:6px 0 6px 20px;padding:0">'+ol.map(function(x){return '<li style="margin:3px 0">'+x+'</li>'}).join('')+'</ol>');continue;
    }
    if(/^### /.test(ln)){out.push('<div style="font-weight:700;margin:10px 0 4px">'+ln.slice(4)+'</div>');continue}
    if(/^## /.test(ln)){out.push('<div style="font-weight:700;font-size:15.5px;margin:10px 0 4px">'+ln.slice(3)+'</div>');continue}
    if(/^# /.test(ln)){out.push('<div style="font-weight:800;font-size:16.5px;margin:12px 0 5px">'+ln.slice(2)+'</div>');continue}
    if(/^\s*$/.test(ln)){out.push('<div style="height:6px"></div>');continue}
    out.push(ln);
  }
  s=out.join('<br>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  s=s.replace(/\u0001B(\d+)\u0001/g,function(m,n){return blocks[+n]});
  s=s.replace(/\u0001I(\d+)\u0001/g,function(m,n){return inls[+n]});
  return s;
}
function renderTable(rows){
  var cells=rows.map(function(r){return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('\|')});
  var head=null;
  if(cells.length>1&&cells[1].every(function(c){return /^\s*:?-{2,}:?\s*$/.test(c)})){head=cells[0];cells.splice(0,2)}
  var bd='1px solid rgba(128,134,150,.35)';
  var h='<table style="border-collapse:collapse;margin:8px 0;font-size:12.5px;max-width:100%;display:block;overflow-x:auto">';
  if(head){h+='<tr>'+head.map(function(c){return '<th style="border:'+bd+';background:var(--bg2);padding:5px 9px;text-align:left;font-weight:700">'+c.trim()+'</th>'}).join('')+'</tr>'}
  for(var i=0;i<cells.length;i++){h+='<tr>'+cells[i].map(function(c){return '<td style="border:'+bd+';padding:5px 9px">'+c.trim()+'</td>'}).join('')+'</tr>'}
  return h+'</table>';
}
function scrollBottom(){chatEl.scrollTop=chatEl.scrollHeight}
function reportHome(v){try{if(window.Android&&Android.uiState)Android.uiState(v?'home':'conv')}catch(e){}}
function openSheet(id){$(id).classList.add('on');if(id=='histSheet')reportHome(true)}
function closeSheet(id){$(id).classList.remove('on');if(id=='histSheet')reportHome(false)}
function openHistHome(){openSheet('histSheet');loadConvs()}

function addTurn(role,html,noScroll){
  var d=document.createElement('div');
  d.className='trow '+(role=='user'?'wrow':'arow');
  if(role=='user'){d.innerHTML='<div class="bub user">'+html+'</div>'}
  else{d.innerHTML='<div class="ai">'+html+'</div>'}
  chatEl.appendChild(d);
  if(!noScroll)scrollBottom();
  return d;
}

function loadPage(){
  fetch('/api/models').then(function(r){return r.json()}).then(function(d){
    meta=d.current||meta;renderPill();
  }).catch(function(){});
  showEmpty();
}
var convMeta={};
function renderPill(){
  var cm=convMeta[curConv];
  var p=cm?(cm.provider||meta.provider):meta.provider, m=cm?cm.model:meta.model;
  var names={dashscope:'Qwen',zhipu:'GLM',deepseek:'DeepSeek',kimi:'Kimi'};
  $('mpName').textContent=(names[p]||p)+' · '+m;
  $('modelPill').title=cm?'本对话使用的模型（切换后下一条消息生效，上下文保留）':'新对话将使用的模型';
}
function renderConvTurns(cid){
  return fetch('/api/conv/'+cid).then(function(r){return r.json()}).then(function(d){
    if(d.id&&d.id!==cid){
      moveFileStore(cid,d.id);
      cid=d.id;
      if(curConv){curConv=cid;try{localStorage.lastConv=cid}catch(e){}}
    }
    if(d.model){convMeta[cid]={model:d.model,provider:d.provider||''};renderPill()}
    chatEl.innerHTML='';
    var turns=d.turns||[];
    if(!turns.length){showEmpty();return}
    hideEmpty();
    for(var i=0;i<turns.length;i++){
      var t=turns[i];
      addTurn(t.role=='user'?'user':'ai',t.role=='user'?esc(t.content):md(t.content),true);
    }
    renderFileCards(cid);
    if(d.live){renderLiveRow(cid,d.live)}
    scrollBottom();
  });
}
function renderLiveRow(cid,live){
  var old=chatEl.querySelector('.trow[data-live]');
  if(old)old.remove();
  if(!live)return;
  var d=document.createElement('div');
  d.className='trow';d.setAttribute('data-live','1');
  var st=live.stage||'思考中';
  d.innerHTML='<div class="tstage"><span class="spin"></span>'+esc(st)+
    (live.tool?'<code style="font-size:11px;opacity:.7">'+esc(live.tool)+'</code>':'')+'</div>';
  chatEl.appendChild(d);scrollBottom();
}
function removeLiveRow(){var o=chatEl.querySelector('.trow[data-live]');if(o)o.remove()}

var flows={};
function send(){
  if(recOn)return;
  var vp=vpBar&&vpBar.dataset.p?vpBar.dataset.p:null;
  var text=tin.value.trim();
  if(!text&&!attachList.length&&!vp)return;
  var curBusy=false,fk;
  for(fk in flows){if(flows[fk]&&!flows[fk].settled&&flows[fk].viewConv===curConv){curBusy=true;break}}
  if(curBusy){toast('当前对话正在回复中…');return}
  hideEmpty();
  if(vp){vpBar.remove();vpBar=null}
  var att=attachList.slice();attachList=[];renderAttach();
  tin.value='';tin.style.height='auto';
  try{tin.blur()}catch(e){}
  try{ if(window.Android&&Android.hideKb) Android.hideKb() }catch(e){}
  var attHtml='';
  for(var i=0;i<att.length;i++){attHtml+='<div style="font-size:12px;opacity:.75">📎 '+esc(att[i].name)+'</div>'}
  if(text||attHtml)addTurn('user',(attHtml||'')+esc(text));
  else addTurn('user','<div style="display:flex;align-items:center;gap:6px">🎤 语音消息</div>');
  chatPost({conv_id:curConv,text:text,attach:att,audio:vp||undefined});
  if(vp)vpDelAudio(vp,90000);
}
function chatPost(payload){
  var fl={key:payload.conv_id||('t'+Date.now()),full:'',settled:false,viewConv:curConv};
  flows[fl.key]=fl;
  busyMap[fl.key]=true;
  fl.d=addTurn('ai','');
  fl.box=fl.d.querySelector('.ai');
  updateStop();
  var preThink=document.createElement('div');preThink.className='tstage';
  preThink.innerHTML='<span class="spin"></span>思考中';
  fl.d.insertBefore(preThink,fl.box);
  var ctrl=new AbortController();fl.ctrl=ctrl;
  var settle=function(){
    if(fl.settled)return;
    fl.settled=true;
    try{ctrl.abort()}catch(e){}
    if(fl.rt){clearTimeout(fl.rt);fl.rt=null}
    delete flows[fl.key];busyMap[fl.key]=false;removeLiveRow();
    var pt=fl.d.querySelector('.tstage');if(pt&&pt.textContent.indexOf('思考中')>=0)pt.remove();
    updateStop();
  };
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload),signal:ctrl.signal}).then(function(res){
    if(!res.ok){settle();return res.text().then(function(t){
      var msg='请求失败('+res.status+') '+t;
      try{var j=JSON.parse(t);if(j&&j.err){msg=j.err;if(j.hint)msg+='\n'+j.hint}}catch(e){}
      fl.box.innerHTML='';fl.box.classList.add('error');fl.box.textContent=msg;
      if(res.status===409)toast('该对话正在执行中，可点方块按钮停止');
    })}
    if(!res.body||typeof res.body.getReader!=='function'){
      return res.text().then(function(t){
        var rows=t.split('\n\n');
        for(var i=0;i<rows.length;i++){
          var chunk=rows[i],ev='',data='';
          var lines=chunk.split('\n');
          for(var j=0;j<lines.length;j++){
            if(lines[j].indexOf('event:')===0)ev=lines[j].slice(6).trim();
            if(lines[j].indexOf('data:')===0)data=lines[j].slice(5).trim();
          }
          if(!ev&&!data)continue;
          try{handleEv(ev,data?JSON.parse(data):{},fl)}catch(e){}
        }
        settle();
      });
    }
    var rd=res.body.getReader(),dec=new TextDecoder(),buf='';
    function pump(){
      return rd.read().then(function(r){
        if(r.done){settle();return}
        buf+=dec.decode(r.value,{stream:true});
        var idx;
        while((idx=buf.indexOf('\n\n'))>=0){
          var chunk=buf.slice(0,idx);buf=buf.slice(idx+2);
          var ev='',data='';
          var lines=chunk.split('\n');
          for(var i2=0;i2<lines.length;i2++){
            if(lines[i2].indexOf('event:')===0)ev=lines[i2].slice(6).trim();
            if(lines[i2].indexOf('data:')===0)data=lines[i2].slice(5).trim();
          }
          if(!ev&&!data)continue;
          try{handleEv(ev,data?JSON.parse(data):{},fl)}catch(e){}
        }
        return pump();
      });
    }
    return pump();
  }).catch(function(err){
    if(err&&err.name==='AbortError')return;
    settle();
    fl.box.innerHTML='';fl.box.classList.add('error');fl.box.textContent='网络错误: '+(err.message||err);
  });
}
var PLAIN_AT=4000, FINAL_MD_MAX=60000, OMIT_AT=20000, OMIT_KEEP=4000;
function streamHtml(s){
  var t=s;
  if(t.length>OMIT_AT){
    var cut=t.length-2*OMIT_KEEP;
    t=t.slice(0,OMIT_KEEP)+'\n…（此处省略 '+cut+' 字，完成后显示全文）…\n'+t.slice(t.length-OMIT_KEEP);
  }
  return '<div style="white-space:pre-wrap;word-break:break-word">'+esc(t)+'</div>';
}
function schedFlow(fl){
  if(fl.rt)return;
  fl.rt=setTimeout(function(){fl.rt=null;flowPaint(fl,false)},120);
}
function flowPaint(fl,fin){
  var box=fl.box;if(!box)return;
  if(fin){
    box.innerHTML=(fl.full.length<=FINAL_MD_MAX?md(fl.full):streamHtml(fl.full));
    return;
  }
  box.innerHTML=(fl.full.length<PLAIN_AT?md(fl.full):streamHtml(fl.full))
    +'<span class="spin" style="display:inline-block;vertical-align:middle"></span>';
  if(fl.key===curConv||fl.viewConv===curConv)scrollBottom();
}
function flowFlush(fl){
  if(fl.rt){clearTimeout(fl.rt);fl.rt=null}
  flowPaint(fl,true);
}
function curFlowBusy(){
  for(var k in flows){ if(flows[k]&&!flows[k].settled&&flows[k].viewConv===curConv) return flows[k] }
  return null;
}
function updateStop(){
  var b=$('stopBtn');if(!b)return;
  b.style.display=curFlowBusy()?'flex':'none';
}
function stopTurn(){
  var fl=curFlowBusy();
  api('api/turn/abort',{conv_id:(fl?fl.key:curConv)||''}).then(function(r){
    toast(r&&r.msg?r.msg:'已请求停止')
  }).catch(function(e){toast('停止失败: '+(e.message||e))});
}
function handleEv(ev,data,fl){
  var box=fl.box,row=fl.d;
  var atView=(fl.key===curConv||fl.viewConv===curConv);
  if(ev==='file'){onFilePush(data,fl);return}
  if(ev==='start'){
    var cid=data.conv_id||fl.key;
    if(cid!==fl.key){
      var switched=!!fl.viewConv;
      moveFileStore(fl.key,cid);
      delete flows[fl.key];busyMap[fl.key]=false;
      fl.key=cid;flows[cid]=fl;busyMap[cid]=true;
      if(switched){
        toast(data.switched_from?('已切换到 '+(data.model||meta.model)+' · 上下文已保留')
                                :'注意：引擎为这条消息新开了一个对话');
      }
    }
    if(curConv===fl.viewConv){
      curConv=cid;localStorage.lastConv=curConv;
      $('title').textContent='对话';
    }
    if(!convMeta[cid]){convMeta[cid]={model:data.model||meta.model,provider:meta.provider};renderPill()}
    else if(data.model&&convMeta[cid].model!==data.model){
      convMeta[cid].model=data.model;convMeta[cid].provider=meta.provider;renderPill();
    }
    hideEmpty();
  }else if(ev==='stage'){
    var stTxt=data.stage||'思考中';
    if(stTxt==='已完成'||stTxt==='回复中'){
      if(stTxt==='已完成'){var oc=row.querySelector('.tstage');if(oc)oc.remove()}
      return;
    }
    var o=row.querySelector('.tstage');
    if(!o){o=document.createElement('div');o.className='tstage';row.insertBefore(o,box)}
    o.innerHTML='<span class="spin"></span>'+esc(stTxt);
  }else if(ev==='think'){
    var tk=row.querySelector('.think');
    if(!tk){tk=document.createElement('div');tk.className='think';row.insertBefore(tk,box)}
    tk.textContent+=data.text||'';
    if(atView)scrollBottom();
  }else if(ev==='delta'){
    removeLiveRow();
    var st=row.querySelector('.tstage');if(st)st.remove();
    fl.full+=data.text||'';
    fl.box=box;
    schedFlow(fl);
  }else if(ev==='tool'){
    if((data.detail||'').indexOf('agent_')===0)return;
    removeLiveRow();
    var tr=document.createElement('div');
    tr.className='toolrow';
    tr.innerHTML='<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L15 12l-3-3z"/></svg>'+
      '<span>'+esc(toolName(data.name))+'</span><code>'+esc(data.detail||'')+'</code>';
    row.insertBefore(tr,box);
    if(atView)scrollBottom();
  }else if(ev==='perm'){
    pollPerms();
  }else if(ev==='avoice'){
    if(data.path)playVoiceQ(withTk('api/audio?path='+encodeURIComponent(data.path)),data.seq===0);
  }else if(ev==='done'){
    removeLiveRow();
    flowFlush(fl);
    var meta2='';
    if(data.tokens>0)meta2+=' · '+data.tokens+' tokens';
    if(data.status&&data.status!=='completed')meta2+=' · 本轮 '+data.status;
    if(meta2)box.insertAdjacentHTML('beforeend','<div class="meta">'+meta2+'</div>');
    busyMap[fl.key]=false;
    if(atView)scrollBottom();
  }else if(ev==='error'){
    removeLiveRow();
    flowFlush(fl);
    var eb=row.querySelector('.error');
    if(!eb){eb=document.createElement('div');eb.className='ai error';row.appendChild(eb)}
    eb.textContent=data.msg||'出错';
    var ets=row.querySelector('.tstage');if(ets)ets.remove();
    busyMap[fl.key]=false;
    if(atView)scrollBottom();
  }
}
function toolName(n){
  var m={commandExecution:'执行命令',mcpToolCall:'设备工具',fileChange:'修改文件',reasoning:'思考'};
  return m[n]||n;
}

function renderFileCards(cid){
  var a=fileStore(cid),seen={},out=[],chg=false;
  for(var i=0;i<a.length;i++){
    if(seen[a[i].p]){chg=true;continue}
    seen[a[i].p]=1;out.push(a[i]);
  }
  if(chg){try{localStorage.setItem('fl_'+cid,JSON.stringify(out))}catch(e){}}
  var fresh=[],old=[];
  for(var j=0;j<out.length;j++){(out[j].t>=pageLoadTs?fresh:old).push(out[j])}
  for(var k=0;k<fresh.length;k++)appendFileCard(fresh[k]);
  appendHistFiles(old);
}
function delFileStore(cid){try{localStorage.removeItem('fl_'+cid)}catch(e){}}
function moveFileStore(from,to){
  if(!from||!to||from===to)return;
  try{
    var a=fileStore(from);
    if(!a.length)return;
    var seen={},out=[],t=fileStore(to),i;
    for(i=0;i<t.length;i++){if(!seen[t[i].p]){seen[t[i].p]=1;out.push(t[i])}}
    for(i=0;i<a.length;i++){if(!seen[a[i].p]){seen[a[i].p]=1;out.push(a[i])}}
    localStorage.setItem('fl_'+to,JSON.stringify(out));
    localStorage.removeItem('fl_'+from);
  }catch(e){}
}

(function(){
  var sx=0,sy=0,st=0;
  document.addEventListener('touchstart',function(e){
    if(e.touches.length>1){sx=-1;return}
    var t=e.target;
    if(t&&(t.closest('input,textarea,[contenteditable="true"],#attachRow,table,pre'))){sx=-1;return}

  },{passive:true});

  if(!keys.length){
    playing=false;
    if(callPendingEnd){ callPendingEnd=false; if(callState==='speaking'||callState==='thinking') cListen() }
    return;
  }
  if(playing)return;
  playing=true;
  var seq=keys[0], item=playQ[seq];
  if(callState!=='speaking'){ cGo('speaking'); cSpk('ai') }
  if(item.buf){ startBuf(item.buf,seq); return }
  fetch(item.url).then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.arrayBuffer() })
    .then(function(ab){ return new Promise(function(res,rej){ micAC.decodeAudioData(ab,res,rej) }) })
    .then(function(buf){
      if(!callOn||!playQ[seq]){ playing=false; pumpPlay(); return }
      item.buf=buf;
      if(paused){ playing=false; return }
      startBuf(buf,seq);
    })
    .catch(function(){ delete playQ[seq]; playing=false; callFail++; if(callFail===3)cTip('语音合成连续失败，只显示字幕'); pumpPlay() });
}
function startBuf(buf,seq){
  kCalibN=0; kCalibSum=0;
  var off=(playQ[seq]&&playQ[seq].off)||0;
  if(!(off>0)) off=0;
  else if(off>=buf.duration){ delete playQ[seq]; playing=false; curSeq=null; pumpPlay(); return }
  var src=micAC.createBufferSource();
  src.buffer=buf; src.connect(outGain);
  curStartAt=micAC.currentTime; curStartOff=off;
  src.onended=function(){
    if(curSrc===src)curSrc=null;
    delete playQ[seq]; playing=false; curSeq=null; pumpPlay();
  };
  curSrc=src; curSeq=seq;
  try{ src.start(0,off) }catch(e){ delete playQ[seq]; playing=false; curSeq=null; pumpPlay() }
}
function stopPlayback(){
  try{ if(curSrc){ curSrc.onended=null; curSrc.stop(0) } }catch(e){}
  curSrc=null; playQ={}; playing=false; curSeq=null;
}
function cSetPauseIcon(){
  var b=$('cPauseBtn'); if(!b)return;
  b.classList.toggle('on',paused);
  b.innerHTML=paused
    ?'<svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6L19 12z"/></svg>'
    :'<svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.4" y="5" width="3.6" height="14" rx="1.2"/></svg>';
}
function pauseCall(){
  if(!callOn||paused)return;
  paused=true;
  try{
    if(curSrc&&micAC){
      var off=curStartOff+Math.max(0,micAC.currentTime-curStartAt);
      if(curSeq!=null&&playQ[curSeq]) playQ[curSeq].off=off;
      curSrc.onended=null; curSrc.stop(0);
    }
  }catch(e){}
  curSrc=null; playing=false; curSeq=null;
  if(callState==='utter'){
    uttChunks=[];
    if(curUtterLine){ curUtterLine.remove(); curUtterLine=null }
    callState='listening';
  }
  vadArmed=false; vadFrames=0;
  applyMic(); cSpk(''); cSetStatus(callState); cSetPauseIcon();
  haptic('click'); cTip('已暂停');
}
function resumeCall(){
  if(!callOn||!paused)return;
  paused=false;
  applyMic(); cSetPauseIcon(); haptic('click');
  if(Object.keys(playQ).length){ pumpPlay() }
  else if(callState==='listening'){ cListen() }
  else { cSetStatus(callState) }
  cTip('已继续');
}
function onAudio(e){
  if(!callOn)return;
  var inp=e.inputBuffer.getChannelData(0);
  var rms=cRms(inp);
  if(callState==='calib'){ calibBuf.push(rms); return }
  var cp=new Float32Array(inp.length); cp.set(inp);
  ring.push(cp); ringLen+=cp.length;
  while(ring.length&&ringLen-ring[0].length>RING_MAX){ ringLen-=ring[0].length; ring.shift() }
  if(muted||paused)return;
  if(callState==='utter'){
    var c=new Float32Array(inp.length); c.set(inp); uttChunks.push(c);
    if(rms>baseThr*0.45) lastVoiceAt=Date.now();
    if(Date.now()-lastVoiceAt>=SIL_MS || Date.now()-utterStart>=MAX_UTTER) endUtter();
    return;
  }
  if(callState==='speaking'){
    outRms=cLvl(outAn);
    if(kCalibN>=0&&outRms>0.06){
      kCalibSum+=rms/Math.max(outRms,0.03); kCalibN++; bargeFrames=0;
      if(kCalibN>=14){ kCouple=Math.max(0.02,Math.min(1.5,(kCalibSum/kCalibN)*1.6)); kCalibN=-1; kCalibSum=0 }
      return;
    }
    var thr=Math.max(baseThr,kCouple*outRms*kMult,0.020);
    if(rms>thr){ bargeFrames++; if(bargeFrames>=12) bargeIn() }
    else bargeFrames=Math.max(0,bargeFrames-2);
    return;
  }
  if(callState==='thinking'){
    outRms=0;
    return;
  }
  if(callState==='listening'&&vadArmed){
    if(rms>baseThr*0.85){
      vadFrames++;
      if(vadFrames>=2) startUtter();
    }else{
      vadFrames=0;
      noiseFloor=0.98*noiseFloor+0.02*rms;
      baseThr=Math.max(0.010,Math.min(0.080,noiseFloor*2.8));
    }
  }
}
function gramOverlap(a,b){
  if(!a||!b)return 0;
  var A={},n=0,i;
  for(i=0;i+3<=a.length;i++){ A[a.slice(i,i+3)]=1; n++ }
  if(!n)return 0;
  var hit=0,t=0;
  for(i=0;i+3<=b.length;i++){ t++; if(A[b.slice(i,i+3)])hit++ }
  return t?hit/t:0;
}
function bargeIn(){
  if(!callOn)return;
  if(callState!=='speaking'&&callState!=='thinking')return;
  stopPlayback();
  callGen++;
  try{ if(callAbort) callAbort.abort() }catch(e){}
  if(callSid) api('/api/call/abort',{sid:callSid},'POST').catch(function(){});
  callPendingEnd=false; curAiLine=null; bargedIn=true;
  uttChunks=[];
  var need=Math.floor(SRC_RATE*0.25), total=0, i;
  for(i=0;i<ring.length;i++) total+=ring[i].length;
  var skip=Math.max(0,total-need), cum=0;
  for(i=0;i<ring.length;i++){
    var c=ring[i];
    if(cum+c.length<=skip){ cum+=c.length; continue }
    var off=Math.max(0,skip-cum);
    uttChunks.push(off?c.subarray(off):c);
    cum+=c.length;
  }
  ring=[]; ringLen=0; bargeFrames=0; vadFrames=0; kCalibN=-1; kCalibSum=0;
  utterStart=Date.now(); lastVoiceAt=utterStart;
  cGo('utter'); cSpk('user');
  curUtterLine=cLine('u','');
  haptic('heavy');
  cTip('已打断');
}
function startUtter(){
  uttChunks=[];
  var need=Math.floor(SRC_RATE*0.6), total=0, i;
  for(i=0;i<ring.length;i++) total+=ring[i].length;
  var skip=Math.max(0,total-need), cum=0;
  for(i=0;i<ring.length;i++){
    var c=ring[i];
    if(cum+c.length<=skip){ cum+=c.length; continue }
    var off=Math.max(0,skip-cum);
    uttChunks.push(off?c.subarray(off):c);
    cum+=c.length;
  }
  utterStart=Date.now(); lastVoiceAt=utterStart; vadFrames=0;
  cGo('utter'); cSpk('user');
  curUtterLine=cLine('u','');
  haptic('tick');
}
function endUtter(){
  var dur=Date.now()-utterStart;
  var chunks=uttChunks; uttChunks=[];
  if(dur<MIN_UTTER||!chunks.length){
    if(curUtterLine){ curUtterLine.remove(); curUtterLine=null }
    cListen(); return;
  }
  cGo('thinking'); cSpk('');
  var wav=encodeWav(chunks);
  cLog('utter end dur='+dur+'ms wav='+wav.length+'B');
  callTurn({audio_b64:b64(wav),audio_mime:'audio/wav'});
}
function encodeWav(chunks){
  var total=0, i;
  for(i=0;i<chunks.length;i++) total+=chunks[i].length;
  var all=new Float32Array(total), o=0;
  for(i=0;i<chunks.length;i++){ all.set(chunks[i],o); o+=chunks[i].length }
  var ratio=Math.max(1,Math.round(SRC_RATE/SEND_RATE));
  var n=Math.floor(all.length/ratio), out=new Int16Array(n);
  for(i=0;i<n;i++){
    var s=0, base=i*ratio;
    for(var k=0;k<ratio;k++) s+=all[base+k];
    s/=ratio;
    if(s>1)s=1; else if(s<-1)s=-1;
    out[i]=s<0?s*0x8000:s*0x7FFF;
  }
  var buf=new ArrayBuffer(44+out.length*2), v=new DataView(buf);
  function ws(off,str){ for(var j=0;j<str.length;j++) v.setUint8(off+j,str.charCodeAt(j)) }
  ws(0,'RIFF'); v.setUint32(4,36+out.length*2,true); ws(8,'WAVE');
  ws(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,SEND_RATE,true); v.setUint32(28,SEND_RATE*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  ws(36,'data'); v.setUint32(40,out.length*2,true);
  for(i=0;i<out.length;i++) v.setInt16(44+i*2,out[i],true);
  return buf;
}
function b64(buf){
  var b=new Uint8Array(buf), s='', CH=8192;
  for(var i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH));
  return btoa(s);
}
function visualLoop(){
  if(!callOn)return;
  requestAnimationFrame(visualLoop);
  var lvl=(callState==='speaking')?cLvl(outAn):cLvl(micAn);
  var bars=$('cBars').children, t=performance.now();
  for(var i=0;i<bars.length;i++){
    var k=0.4+0.6*Math.abs(Math.sin((i+1)*1.63+t/240));
    bars[i].style.transform='scaleY('+(0.14+lvl*2.6*k).toFixed(3)+')';
  }
  var r=$('cRing');
  r.style.transform='scale('+(1+lvl*0.34).toFixed(3)+')';
  r.style.opacity=(0.22+lvl*0.5).toFixed(3);
}
$('callBtn').onclick=function(){ haptic('click'); startCall() };
$('cHangBtn').onclick=function(){ haptic('heavy'); endCall('hangup') };
$('cPauseBtn').onclick=function(){ if(!callOn)return; if(paused) resumeCall(); else pauseCall() };
$('cSpkBtn').onclick=function(){ haptic('tick'); applySpk(!spkMode) };
if(!spkAvail) $('cSpkBtn').style.display='none';
$('cMuteBtn').onclick=function(){
  if(!callOn)return;
  muted=!muted; this.classList.toggle('on',muted); haptic('click');
  if(muted){ cGo('muted'); cSpk('') } else cListen();
};
$('cSubBtn').onclick=function(){
  subsOn=!subsOn;
  this.classList.toggle('on',subsOn);
  $('cSub').classList.toggle('off',!subsOn);
};
$('cWave').onclick=function(e){
  if(!callOn||paused)return;
  if(e&&e.target&&e.target.id==='cTap')return;
  if(callState==='speaking'||Object.keys(playQ).length){ stopPlayback(); cTip('已打断'); cListen() }
};
(function(){
  var t=$('cTap'), down=false;
  t.addEventListener('pointerdown',function(e){
    e.preventDefault();
    if(down||!callOn)return;
    down=true;
    if(window.Android&&window.Android.startVoice){
      var r=window.Android.startVoice();
      if(r!=='started'){ down=false; cTip('录音启动失败：'+r) }
    }else{ down=false; cTip('此环境不支持录音') }
  });
  t.addEventListener('pointerup',function(e){
    e.preventDefault();
    if(!down)return;
    down=false;
    if(window.Android&&window.Android.stopVoice) window.Android.stopVoice();
  });
  t.addEventListener('pointercancel',function(){
    if(!down)return;
    down=false;
    recAbort=true;
    if(window.Android&&window.Android.cancelVoice) window.Android.cancelVoice();
  });
})();
(function(){
  var prev=window.onNativeVoice;
  window.onNativeVoice=function(text,path){
    if(callOn){
      if(path)vpDelAudio(path);
      if(recAbort){ recAbort=false; return }
      if(callState==='fallback'){
        if(text){ cLine('u',text); callTurn({text:text}) }
        else cTip('没听清，再试一次');
      }
      return;
    }
    if(prev) prev(text,path);
  };
})();
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&callOn){
    try{ if(micAC&&micAC.state==='suspended') micAC.resume() }catch(e){}
    requestWake();
  }
});
window.addEventListener('pagehide',function(){
  if(!callOn)return;
  var cid=callConv, sid=callSid, dur=Math.floor((Date.now()-callT0)/1000);
  callOn=false;
  try{
    if(cid) fetch('/api/call/end',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({conv_id:cid,reason:'pagehide',dur:dur}),keepalive:true}).catch(function(){});
  }catch(e){}
  try{
    if(sid) fetch('/api/call/abort',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({sid:sid}),keepalive:true}).catch(function(){});
  }catch(e){}
  try{ callTeardown() }catch(e){}
});
window.addEventListener('pageshow',function(e){
  if(e&&e.persisted&&!callOn&&$('callpg').classList.contains('open')){ try{ callTeardown() }catch(e){} }
});
settleStaleCall();
window.addEventListener('error',function(e){
  cLog('jserr '+(e&&e.message||e)+' @'+(e&&e.filename?'':'')+(e&&e.lineno||0));
});
window.addEventListener('unhandledrejection',function(e){
  cLog('jsrej '+String(e&&e.reason).slice(0,200));
});
